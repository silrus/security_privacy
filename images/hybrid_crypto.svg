<svg viewBox="0 0 820 560" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, Verdana, sans-serif">
  <defs>
    <pattern id="dots3" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#000" opacity="0.18"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000"/>
    </marker>
    <g id="girl3">
      <path d="M-44,-10 C-72,2 -68,46 -56,66 C-60,32 -52,10 -42,6 Z" fill="#1a1a1a"/>
      <path d="M44,-10 C72,2 68,46 56,66 C60,32 52,10 42,6 Z" fill="#1a1a1a"/>
      <circle cx="0" cy="-4" r="46" fill="#1a1a1a"/>
      <ellipse cx="0" cy="8" rx="37" ry="34" fill="#fff" stroke="#000" stroke-width="2"/>
      <path d="M-37,0 C-36,-30 36,-30 37,0 L28,-4 L20,6 L12,-6 L2,4 L-8,-6 L-18,5 L-28,-4 Z" fill="#1a1a1a"/>
      <ellipse cx="-15" cy="14" rx="7" ry="10" fill="#000"/>
      <ellipse cx="15" cy="14" rx="7" ry="10" fill="#000"/>
      <circle cx="-13" cy="11" r="2.5" fill="#fff"/>
      <circle cx="17" cy="11" r="2.5" fill="#fff"/>
      <circle cx="-15" cy="14" r="13" fill="none" stroke="#000" stroke-width="2"/>
      <circle cx="15" cy="14" r="13" fill="none" stroke="#000" stroke-width="2"/>
      <line x1="-2" y1="14" x2="2" y2="14" stroke="#000" stroke-width="2"/>
      <path d="M-8,28 Q0,38 8,28" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M-22,40 L22,40 L32,92 L-32,92 Z" fill="#fff" stroke="#000" stroke-width="2"/>
      <path d="M0,46 L-13,39 L-13,53 Z" fill="#1a1a1a"/>
      <path d="M0,46 L13,39 L13,53 Z" fill="#1a1a1a"/>
    </g>
    <g id="key3">
      <circle cx="0" cy="0" r="7" fill="none" stroke="#000" stroke-width="2.5"/>
      <line x1="6" y1="3" x2="24" y2="14" stroke="#000" stroke-width="2.5"/>
      <line x1="16" y1="9" x2="13" y2="16" stroke="#000" stroke-width="2.5"/>
      <line x1="22" y1="13" x2="19" y2="20" stroke="#000" stroke-width="2.5"/>
    </g>
  </defs>

  <rect x="1" y="1" width="818" height="558" fill="#fff" stroke="#000" stroke-width="2"/>

  <rect x="14" y="12" width="400" height="34" rx="8" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="36" cy="29" r="7" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="41" y1="34" x2="52" y2="43" stroke="#000" stroke-width="2.5"/>
  <text x="62" y="35" font-size="19" font-weight="bold">Гибридная криптосистема</text>

  <!-- actors -->
  <text x="120" y="80" font-size="15" font-weight="bold" text-anchor="middle">ОТПРАВИТЕЛЬ</text>
  <text x="700" y="80" font-size="15" font-weight="bold" text-anchor="middle">ПОЛУЧАТЕЛЬ</text>

  <!-- internet cloud -->
  <g>
    <ellipse cx="410" cy="200" rx="64" ry="34" fill="url(#dots3)" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="362" cy="212" rx="30" ry="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="458" cy="212" rx="30" ry="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <ellipse cx="410" cy="206" rx="44" ry="24" fill="#fff"/>
    <text x="410" y="212" font-size="15" font-weight="bold" text-anchor="middle">ИНТЕРНЕТ</text>
  </g>

  <!-- ROW 1: message path -->
  <rect x="40" y="110" width="110" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="95" y="133" font-size="13" text-anchor="middle">Сообщение</text>
  <text x="95" y="152" font-size="12" font-style="italic" text-anchor="middle">«привет!»</text>

  <line x1="150" y1="138" x2="218" y2="138" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="184" y="127" font-size="10" text-anchor="middle" font-weight="bold">AES, ключ K</text>

  <rect x="222" y="110" width="110" height="56" rx="6" fill="url(#dots3)" stroke="#000" stroke-width="2.5"/>
  <text x="277" y="133" font-size="13" font-weight="bold" text-anchor="middle">Шифртекст</text>
  <text x="277" y="152" font-size="12" text-anchor="middle" font-family="Courier New, monospace">010110...</text>

  <line x1="332" y1="150" x2="372" y2="178" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="448" y1="178" x2="488" y2="150" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="492" y="110" width="110" height="56" rx="6" fill="url(#dots3)" stroke="#000" stroke-width="2.5"/>
  <text x="547" y="133" font-size="13" font-weight="bold" text-anchor="middle">Шифртекст</text>
  <text x="547" y="152" font-size="12" text-anchor="middle" font-family="Courier New, monospace">010110...</text>

  <line x1="602" y1="138" x2="668" y2="138" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="635" y="126" font-size="11" text-anchor="middle" font-weight="bold">ключ K</text>

  <rect x="672" y="110" width="110" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="727" y="133" font-size="13" text-anchor="middle">Сообщение</text>
  <text x="727" y="152" font-size="12" font-style="italic" text-anchor="middle">«привет!»</text>

  <!-- ROW 2: key path -->
  <rect x="40" y="250" width="110" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <use href="#key3" transform="translate(78,272)"/>
  <text x="115" y="282" font-size="13" font-weight="bold">K</text>
  <text x="95" y="298" font-size="11" text-anchor="middle">общий ключ</text>

  <line x1="150" y1="278" x2="218" y2="278" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="184" y="261" font-size="10" text-anchor="middle" font-weight="bold">публичным</text>
  <text x="184" y="272" font-size="10" text-anchor="middle" font-weight="bold">ключом</text>

  <rect x="222" y="250" width="110" height="56" rx="6" fill="url(#dots3)" stroke="#000" stroke-width="2.5"/>
  <text x="277" y="273" font-size="12" font-weight="bold" text-anchor="middle">Зашифрован-</text>
  <text x="277" y="288" font-size="12" font-weight="bold" text-anchor="middle">ный ключ K</text>

  <line x1="332" y1="262" x2="372" y2="226" stroke="#000" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>
  <line x1="448" y1="226" x2="488" y2="262" stroke="#000" stroke-width="2.5" stroke-dasharray="7,5" marker-end="url(#arr)"/>

  <rect x="492" y="250" width="110" height="56" rx="6" fill="url(#dots3)" stroke="#000" stroke-width="2.5"/>
  <text x="547" y="273" font-size="12" font-weight="bold" text-anchor="middle">Зашифрован-</text>
  <text x="547" y="288" font-size="12" font-weight="bold" text-anchor="middle">ный ключ K</text>

  <line x1="602" y1="278" x2="668" y2="278" stroke="#000" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="635" y="261" font-size="10" text-anchor="middle" font-weight="bold">приватным</text>
  <text x="635" y="272" font-size="10" text-anchor="middle" font-weight="bold">ключом</text>

  <rect x="672" y="250" width="110" height="56" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <use href="#key3" transform="translate(710,272)"/>
  <text x="747" y="282" font-size="13" font-weight="bold">K</text>
  <text x="727" y="298" font-size="11" text-anchor="middle">тот же ключ!</text>

  <!-- row labels -->
  <text x="40" y="105" font-size="12" font-weight="bold" opacity="0.7">1. Сообщение — быстрым симметричным шифром</text>
  <text x="40" y="245" font-size="12" font-weight="bold" opacity="0.7">2. Сам ключ — медленным асимметричным</text>

  <!-- bottom: girl + bubble -->
  <use href="#girl3" transform="translate(96,430)"/>
  <path d="M170,448 L196,461 L172,475 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="190" y="346" width="606" height="186" rx="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="192" y="448" width="20" height="24" fill="#fff"/>
  <g font-size="16" text-anchor="middle">
    <text x="493" y="380" font-weight="bold">НЕДОСТАТКИ ВОСПОЛНЯЮТ ДРУГ ДРУГА!</text>
    <text x="493" y="410">Симметричный шифр быстрый, но ключ не передать.</text>
    <text x="493" y="434">Асимметричный медленный, но ключами меняться легко.</text>
    <text x="493" y="464" font-weight="bold">Поэтому ключ K шифруем открытым ключом и передаём,</text>
    <text x="493" y="488" font-weight="bold">а сообщение — общим ключом K. Вот в таком порядке!</text>
    <text x="493" y="516" font-size="13" font-style="italic">Так работает весь TLS/https: только вместо RSA сегодня X25519 + ML-KEM</text>
  </g>
</svg>
