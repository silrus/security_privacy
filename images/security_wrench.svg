<svg viewBox="0 0 780 470" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, Verdana, sans-serif">
  <defs>
    <pattern id="dots2" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#000" opacity="0.18"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="778" height="468" fill="#fff" stroke="#000" stroke-width="2"/>

  <rect x="14" y="12" width="660" height="34" rx="8" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="36" cy="29" r="7" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="41" y1="34" x2="52" y2="43" stroke="#000" stroke-width="2.5"/>
  <text x="62" y="35" font-size="19" font-weight="bold">Что на самом деле будет делать злоумышленник</text>

  <!-- Panel 1: fantasy -->
  <rect x="14" y="58" width="368" height="352" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="14" y="58" width="368" height="30" fill="url(#dots2)" stroke="#000" stroke-width="2.5"/>
  <text x="198" y="79" font-size="15" font-weight="bold" text-anchor="middle">ФАНТАЗИЯ КРИПТОГРАФА</text>

  <!-- thought bubble -->
  <ellipse cx="198" cy="160" rx="168" ry="62" fill="#fff" stroke="#000" stroke-width="2.5" stroke-dasharray="1,6" stroke-linecap="round"/>
  <g font-size="14" text-anchor="middle">
    <text x="198" y="140">Его диск зашифрован</text>
    <text x="198" y="160" font-weight="bold">AES-256 c LUKS!</text>
    <text x="198" y="180">Нужен кластер на миллиард и</text>
    <text x="198" y="198" font-weight="bold">миллион лет перебора... Сдаюсь!</text>
  </g>
  <circle cx="116" cy="238" r="6" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="100" cy="256" r="4" fill="none" stroke="#000" stroke-width="2"/>

  <!-- villain at desk -->
  <circle cx="120" cy="305" r="28" fill="#1a1a1a"/>
  <ellipse cx="120" cy="312" rx="22" ry="20" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M-22,0 C-20,-18 20,-18 22,0 L14,-3 L6,4 L-2,-4 L-10,4 L-18,-3 Z" transform="translate(120,302)" fill="#1a1a1a"/>
  <line x1="108" y1="310" x2="118" y2="314" stroke="#000" stroke-width="2"/>
  <line x1="132" y1="314" x2="142" y2="310" stroke="#000" stroke-width="2"/>
  <path d="M112,326 Q120,321 128,326" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M98,332 L142,332 L150,372 L90,372 Z" fill="#1a1a1a"/>
  <!-- laptop -->
  <rect x="178" y="318" width="92" height="54" rx="4" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="186" y="326" width="76" height="30" fill="url(#dots2)" stroke="#000" stroke-width="1.5"/>
  <text x="224" y="346" font-size="11" font-weight="bold" text-anchor="middle">LUKS2</text>
  <rect x="170" y="372" width="108" height="8" fill="#000"/>
  <text x="198" y="398" font-size="13" text-anchor="middle" font-style="italic">шансов ноль: математика на нашей стороне</text>

  <!-- Panel 2: reality -->
  <rect x="398" y="58" width="368" height="352" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="398" y="58" width="368" height="30" fill="url(#dots2)" stroke="#000" stroke-width="2.5"/>
  <text x="582" y="79" font-size="15" font-weight="bold" text-anchor="middle">РЕАЛЬНОСТЬ</text>

  <!-- speech bubble (spiky) -->
  <path d="M444,108 L730,108 L748,128 L730,168 L640,168 L620,190 L612,168 L444,168 L428,138 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="588" y="134" font-size="15" font-weight="bold" text-anchor="middle">ГОВОРИ ПАРОЛЬ,</text>
  <text x="588" y="156" font-size="15" font-weight="bold" text-anchor="middle">ПОКА НЕ ПОЛУЧИЛ КЛЮЧОМ!</text>

  <!-- thug -->
  <circle cx="500" cy="268" r="30" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <path d="M470,262 A30,30 0 0,1 530,262 L524,256 L514,262 L504,254 L494,262 L484,254 L476,262 Z" fill="#1a1a1a"/>
  <line x1="486" y1="268" x2="498" y2="272" stroke="#000" stroke-width="2.5"/>
  <line x1="514" y1="272" x2="526" y2="268" stroke="#000" stroke-width="2.5"/>
  <path d="M490,286 Q500,280 510,286" fill="none" stroke="#000" stroke-width="2.5"/>
  <path d="M478,296 L522,296 L534,368 L466,368 Z" fill="#1a1a1a"/>
  <!-- arm + wrench -->
  <line x1="528" y1="310" x2="572" y2="282" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(572,282) rotate(-35)">
    <rect x="0" y="-5" width="64" height="10" rx="4" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <path d="M64,-14 a14,14 0 1,1 0,28 l-6,-8 a8,8 0 0,0 0,-12 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
  </g>
  <text x="596" y="330" font-size="13" text-anchor="middle">гаечный ключ</text>
  <text x="596" y="347" font-size="13" font-weight="bold" text-anchor="middle">за 500 рублей</text>
  <!-- scared victim -->
  <circle cx="700" cy="290" r="24" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <path d="M678,284 A24,24 0 0,1 722,284 L716,280 L708,286 L700,278 L692,286 L684,280 Z" fill="#1a1a1a"/>
  <circle cx="692" cy="292" r="3.5" fill="#000"/>
  <circle cx="708" cy="292" r="3.5" fill="#000"/>
  <ellipse cx="700" cy="306" rx="5" ry="7" fill="#000"/>
  <path d="M722,272 l6,-10 M726,280 l10,-6" stroke="#000" stroke-width="2"/>
  <path d="M688,322 L712,322 L720,368 L680,368 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="690" y="392" font-size="13" text-anchor="middle" font-style="italic">«AES-256 не помог...»</text>

  <!-- moral -->
  <rect x="14" y="420" width="752" height="38" fill="url(#dots2)" stroke="#000" stroke-width="2.5"/>
  <text x="390" y="444" font-size="15" font-weight="bold" text-anchor="middle">Криптографию не ломают — её обходят. Безопасность — это вся система.</text>
  <text x="766" y="40" font-size="11" text-anchor="end" opacity="0.6">по мотивам xkcd 538</text>
</svg>
