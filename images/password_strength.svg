<svg viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg" font-family="Trebuchet MS, Verdana, sans-serif">
  <defs>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.3" fill="#000" opacity="0.18"/>
    </pattern>
    <g id="girl">
      <path d="M-44,-10 C-72,2 -68,46 -56,66 C-60,32 -52,10 -42,6 Z" fill="#1a1a1a"/>
      <path d="M44,-10 C72,2 68,46 56,66 C60,32 52,10 42,6 Z" fill="#1a1a1a"/>
      <circle cx="0" cy="-4" r="46" fill="#1a1a1a"/>
      <ellipse cx="0" cy="8" rx="37" ry="34" fill="#fff" stroke="#000" stroke-width="2"/>
      <path d="M-37,0 C-36,-30 36,-30 37,0 L28,-4 L20,6 L12,-6 L2,4 L-8,-6 L-18,5 L-28,-4 Z" fill="#1a1a1a"/>
      <ellipse cx="-15" cy="14" rx="7" ry="10" fill="#000"/>
      <ellipse cx="15" cy="14" rx="7" ry="10" fill="#000"/>
      <circle cx="-13" cy="11" r="2.5" fill="#fff"/>
      <circle cx="17" cy="11" r="2.5" fill="#fff"/>
      <circle cx="-15" cy="14" r="13" fill="none" stroke="#000" stroke-width="2"/>
      <circle cx="15" cy="14" r="13" fill="none" stroke="#000" stroke-width="2"/>
      <line x1="-2" y1="14" x2="2" y2="14" stroke="#000" stroke-width="2"/>
      <path d="M-7,30 Q0,37 7,30" fill="none" stroke="#000" stroke-width="2"/>
      <path d="M-22,40 L22,40 L32,92 L-32,92 Z" fill="#fff" stroke="#000" stroke-width="2"/>
      <path d="M0,46 L-13,39 L-13,53 Z" fill="#1a1a1a"/>
      <path d="M0,46 L13,39 L13,53 Z" fill="#1a1a1a"/>
    </g>
  </defs>

  <rect x="1" y="1" width="778" height="558" fill="#fff" stroke="#000" stroke-width="2"/>

  <!-- header strip -->
  <rect x="14" y="12" width="430" height="34" rx="8" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <circle cx="36" cy="29" r="7" fill="none" stroke="#000" stroke-width="2.5"/>
  <line x1="41" y1="34" x2="52" y2="43" stroke="#000" stroke-width="2.5"/>
  <text x="62" y="35" font-size="19" font-weight="bold">Стойкость паролей</text>

  <!-- Panel A -->
  <rect x="14" y="58" width="368" height="300" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="14" y="58" width="368" height="30" fill="url(#dots)" stroke="#000" stroke-width="2.5"/>
  <text x="198" y="79" font-size="15" font-weight="bold" text-anchor="middle">«СЛОЖНЫЙ» ПАРОЛЬ</text>
  <rect x="80" y="106" width="236" height="40" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <text x="198" y="133" font-size="22" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">Tr0ub4dor&amp;3</text>
  <!-- confused brain -->
  <circle cx="110" cy="205" r="26" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M100,200 q4,-8 8,0 q4,8 8,0 q4,-8 8,0" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M101,214 Q110,208 119,214" fill="none" stroke="#000" stroke-width="2"/>
  <text x="110" y="252" font-size="13" text-anchor="middle">человек:</text>
  <text x="110" y="268" font-size="13" font-weight="bold" text-anchor="middle">не помнит</text>
  <!-- happy computer -->
  <rect x="240" y="182" width="52" height="38" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="256" y="220" width="20" height="8" fill="#000"/>
  <circle cx="256" cy="196" r="3" fill="#000"/>
  <circle cx="276" cy="196" r="3" fill="#000"/>
  <path d="M254,208 Q266,216 278,208" fill="none" stroke="#000" stroke-width="2"/>
  <text x="266" y="252" font-size="13" text-anchor="middle">GPU:</text>
  <text x="266" y="268" font-size="13" font-weight="bold" text-anchor="middle">часы перебора</text>
  <rect x="40" y="290" width="316" height="48" rx="6" fill="url(#dots)" stroke="#000" stroke-width="2"/>
  <text x="198" y="310" font-size="14" font-weight="bold" text-anchor="middle">энтропия ~28 бит</text>
  <text x="198" y="328" font-size="13" text-anchor="middle">замены a→4 предсказуемы и почти не помогают</text>

  <!-- Panel B -->
  <rect x="398" y="58" width="368" height="300" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="398" y="58" width="368" height="30" fill="url(#dots)" stroke="#000" stroke-width="2.5"/>
  <text x="582" y="79" font-size="15" font-weight="bold" text-anchor="middle">4 СЛУЧАЙНЫХ СЛОВА</text>
  <g font-size="16" font-weight="bold" text-anchor="middle" font-family="Courier New, monospace">
    <rect x="420" y="104" width="106" height="32" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="473" y="126">лошадь</text>
    <rect x="540" y="104" width="116" height="32" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="598" y="126">батарея</text>
    <rect x="440" y="142" width="96" height="32" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="488" y="164">рамэн</text>
    <rect x="550" y="142" width="106" height="32" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
    <text x="603" y="164">фонарь</text>
  </g>
  <!-- happy brain -->
  <circle cx="494" cy="215" r="26" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M484,208 q5,6 10,0 M494,208 q5,6 10,0" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M485,222 Q494,230 503,222" fill="none" stroke="#000" stroke-width="2"/>
  <text x="494" y="258" font-size="13" text-anchor="middle">человек:</text>
  <text x="494" y="274" font-size="13" font-weight="bold" text-anchor="middle">запомнил!</text>
  <!-- dizzy computer -->
  <rect x="624" y="192" width="52" height="38" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
  <rect x="640" y="230" width="20" height="8" fill="#000"/>
  <path d="M636,202 l8,8 M644,202 l-8,8" stroke="#000" stroke-width="2"/>
  <path d="M656,202 l8,8 M664,202 l-8,8" stroke="#000" stroke-width="2"/>
  <path d="M638,220 Q650,214 662,220" fill="none" stroke="#000" stroke-width="2"/>
  <text x="650" y="258" font-size="13" text-anchor="middle">GPU:</text>
  <text x="650" y="274" font-size="13" font-weight="bold" text-anchor="middle">столетия...</text>
  <rect x="424" y="290" width="316" height="48" rx="6" fill="url(#dots)" stroke="#000" stroke-width="2"/>
  <text x="582" y="310" font-size="14" font-weight="bold" text-anchor="middle">энтропия ~44 бита (11 бит × 4 слова)</text>
  <text x="582" y="328" font-size="13" text-anchor="middle">каждое слово — из словаря в 2048 слов</text>

  <!-- bottom: girl + bubble -->
  <use href="#girl" transform="translate(96,438)"/>
  <path d="M170,455 L196,468 L172,482 Z" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="190" y="392" width="566" height="148" rx="20" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="192" y="455" width="20" height="24" fill="#fff"/>
  <g font-size="17" text-anchor="middle">
    <text x="473" y="426" font-weight="bold">БЕРИТЕ 4-5 СЛУЧАЙНЫХ СЛОВ ИЗ БОЛЬШОГО СЛОВАРЯ!</text>
    <text x="473" y="456">Энтропия складывается, а запоминается как картинка.</text>
    <text x="473" y="482">Только слова должен выбирать генератор случайных чисел,</text>
    <text x="473" y="506" font-weight="bold">а не Вы — иначе перебор резко упрощается!</text>
  </g>
  <text x="764" y="552" font-size="11" text-anchor="end" opacity="0.6">по мотивам xkcd 936</text>
</svg>
